<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
      width: 240px;
    }

    header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      flex: 1;
    }

    #release-id {
      font-size: 11px;
      color: #888;
      font-family: monospace;
    }

    main {
      padding: 10px 12px;
    }

    .field {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select {
      width: 100%;
      padding: 5px 6px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 13px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }

    .checkbox-row input[type=checkbox] {
      accent-color: #d6844a;
      width: 14px;
      height: 14px;
    }

    .checkbox-row span {
      font-size: 13px;
    }

    .sub-field {
      margin-left: 21px;
      margin-top: 5px;
      margin-bottom: 4px;
    }

    .sub-field input[type=text] {
      width: 100%;
      padding: 4px 6px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      font-family: monospace;
    }

    .hidden { display: none; }

    button {
      width: 100%;
      padding: 7px;
      background: #d6844a;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #e8965c; }
    button:disabled { background: #555; cursor: default; }

    #status {
      margin-top: 8px;
      font-size: 11px;
      min-height: 16px;
      color: #888;
    }

    #status.ok    { color: #6dbf67; }
    #status.error { color: #e06060; }

    /* ── Job progress ─────────────────────────────────────────────────── */

    #progress {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #2a2a2a;
    }

    #progress.hidden { display: none; }

    #job-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
    }

    #job-title {
      font-size: 11px;
      color: #ccc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #queue-count {
      font-size: 10px;
      color: #888;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 1px 6px;
      white-space: nowrap;
    }

    #queue-count.hidden { display: none; }

    ul#stages {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    ul#stages li {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }

    .stage-mark {
      width: 12px;
      text-align: center;
      flex: 0 0 12px;
      font-size: 10px;
    }

    .stage-name  { flex: 1; }
    .stage-count { color: #777; font-variant-numeric: tabular-nums; }

    li.pending  { color: #555; }
    li.active   { color: #e0e0e0; }
    li.active .stage-mark { color: #d6844a; }
    li.done     { color: #8a8a8a; }
    li.done .stage-mark   { color: #6dbf67; }
    li.skip     { color: #4a4a4a; }
    li.error    { color: #e06060; }
    li.warn .stage-mark   { color: #d6a44a; }

    #job-error {
      margin-top: 6px;
      font-size: 11px;
      color: #e06060;
      word-break: break-word;
    }

    #job-error.hidden { display: none; }

    footer {
      padding: 8px 12px 10px;
      border-top: 1px solid #2a2a2a;
    }

    footer label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #666;
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
    }

    footer input[type=number] {
      width: 60px;
      padding: 3px 5px;
      background: #222;
      border: 1px solid #383838;
      border-radius: 3px;
      color: #888;
      font-size: 11px;
      font-family: monospace;
    }

    #connections {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .conn-dot {
      font-size: 11px;
      color: #444;
    }
    .conn-dot.ok    { color: #6dbf67; }
    .conn-dot.error { color: #e06060; }
  </style>
</head>
<body>
  <header>
    <h1>Print Label</h1>
    <span id="release-id">—</span>
  </header>

  <main>
    <div class="field">
      <label for="profile">Label profile</label>
      <select id="profile">
        <option value="dk1247">DK-1247 die-cut 103×164mm</option>
        <option value="dk22243">DK-22243 continuous 102mm</option>
      </select>
    </div>

    <div class="checkbox-row" style="margin-bottom:4px">
      <input type="checkbox" id="split">
      <span>Split by disc</span>
    </div>

    <div class="sub-field hidden" id="discs-row">
      <label for="discs">Discs to print (blank = all)</label>
      <input type="text" id="discs" placeholder="e.g. 1 3">
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="hide-bpm">
      <span>Hide BPM on label</span>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="preview-only">
      <span>Preview only (open PNG)</span>
    </div>

    <button id="print-btn" disabled>Print Label</button>

    <div id="status"></div>

    <div id="progress" class="hidden">
      <div id="job-header">
        <span id="job-title">—</span>
        <span id="queue-count" class="hidden"></span>
      </div>
      <ul id="stages">
        <li data-stage="lookup"  class="pending">
          <span class="stage-mark">○</span>
          <span class="stage-name">Release lookup</span>
          <span class="stage-count"></span>
        </li>
        <li data-stage="samples" class="pending">
          <span class="stage-mark">○</span>
          <span class="stage-name">Sample download</span>
          <span class="stage-count"></span>
        </li>
        <li data-stage="bpm"     class="pending">
          <span class="stage-mark">○</span>
          <span class="stage-name">BPM calculation</span>
          <span class="stage-count"></span>
        </li>
        <li data-stage="render"  class="pending">
          <span class="stage-mark">○</span>
          <span class="stage-name">Render label</span>
          <span class="stage-count"></span>
        </li>
        <li data-stage="print"   class="pending">
          <span class="stage-mark">○</span>
          <span class="stage-name">Sent to printer</span>
          <span class="stage-count"></span>
        </li>
      </ul>
      <div id="job-error" class="hidden"></div>
    </div>
  </main>

  <footer>
    <label>
      Server port
      <input type="number" id="port" min="1024" max="65535" value="5679">
    </label>
    <div id="connections">
      <span id="conn-discogs"  class="conn-dot" title="Discogs">●&nbsp;Discogs</span>
      <span id="conn-beatport" class="conn-dot" title="Beatport">●&nbsp;Beatport</span>
      <span id="conn-anthropic" class="conn-dot" title="Anthropic (Claude)">●&nbsp;Anthropic</span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
